name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only the ones targeting main. A change stacked on another
  # branch ran no checks at all, which is the case where they are worth the most: it is
  # the one nobody has reviewed against a green build yet.
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run adapter contract conformance
        run: pnpm test:contract

      - name: Run the pipeline end to end
        run: pnpm test:agent

      # The command a pipeline runs, run the way a pipeline runs it. The unit suites
      # cover the engine; this covers the thing that has to work on someone else's
      # machine — that it builds, that it resolves, and that its exit codes are what a
      # merge gate depends on.
      - name: Build packages
        run: pnpm build

      - name: Check the blast command gates a merge
        run: |
          set -euo pipefail

          pnpm blast brief fixture --intent "smoke test" > /tmp/brief.md
          grep -q "Verdict: hold" /tmp/brief.md

          # The sample change is held, so a gate at `hold` must fail and a run with no
          # gate must not. A tool that exits 0 on a held verdict is a gate nobody notices
          # has stopped working.
          if pnpm blast brief fixture --intent "smoke test" --fail-on hold > /dev/null 2>&1; then
            echo "expected --fail-on hold to exit non-zero on a held verdict" >&2
            exit 1
          fi

          # A broken run and a held verdict must not look the same to the job.
          set +e
          pnpm blast brief 0 --intent "smoke test" > /dev/null 2>&1
          broken=$?
          set -e
          if [ "$broken" != "2" ]; then
            echo "expected a pull request that cannot be read to exit 2, got $broken" >&2
            exit 1
          fi

  build-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile the agent
        run: pnpm exec eve build

      - name: Build the web surface
        run: pnpm --filter @blast/web build
